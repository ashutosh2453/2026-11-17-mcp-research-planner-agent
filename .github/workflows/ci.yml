name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-agent .
      - name: MCP server answers a tools/list over stdio
        run: |
          docker run --rm --entrypoint python research-agent -c "
          import asyncio
          from research_agent.toolbox import McpToolbox
          async def main():
              async with McpToolbox.stdio() as tb:
                  assert len(tb.tool_names) == 6, tb.tool_names
                  print(sorted(tb.tool_names))
          asyncio.run(main())"
